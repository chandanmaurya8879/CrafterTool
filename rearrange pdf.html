<title>Rearrange PDF Pages | CrafterTool</title>

<header class="header">

<div class="container">

<h1>Rearrange PDF Pages</h1>

<p>Upload a PDF and change the page order.</p>

<input
type="file"
id="pdfFile"
accept=".pdf">

<div id="info"></div>

<label>Enter New Page Order</label>

<input
type="text"
id="order"
placeholder="Example: 3,1,2,5,4">

<br><br>

<button id="rearrangeBtn">
Rearrange PDF
</button>

<br><br>

<a
id="downloadBtn"
download="rearranged.pdf"
style="display:none;">
Download PDF
</a>
