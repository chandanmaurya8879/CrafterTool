<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF to Image | CrafterTool</title>

<link rel="stylesheet" href="pdf-image.css">

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

</head>

<body>

<header class="header">

<a href="index.html" class="logo">CrafterTool</a>

<nav>
<a href="index.html">Home</a>
<a href="#">Tools</a>
</nav>

</header>

<div class="container">

<h1>PDF TO IMAGE</h1>

<p>Convert PDF pages into JPG images.</p>

<input
type="file"
id="pdfInput"
accept=".pdf">

<div id="preview"></div>

<button id="convertBtn">
<strong>Convert PDF</strong>
</button>

<div style="max-width: 800px;
  margin: 40px auto; 
  padding: 0 20px; 
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  text-align: left;"
    
    <!-- Main Heading -->
    <h2 style="font-size: 24px; color: #2b3a8f; margin-bottom: 20px; font-weight: 600; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">
        How to use <strong>PDF TO IMAGE </strong>
    </h2>
    
    <!-- Instructions List -->
    <ul style="list-style-type: none; padding-left: 0; line-height: 1.8; color: #333333; font-size: 15px;">
        <li style="margin-bottom: 15px;">
            <strong style="color: #2b3a8f;">Click the Choose file:</strong> Select al least two or more pdf from your computer or phone.
        </li>
    
        <li style="margin-bottom: 15px;">
            <strong style="color: #2b3a8f;">Convert pdf:</strong> Click convert pdf  to save it back to your device.
        </li>
    </ul>

</div>

</div>

<script src="pdf-image.js"></script>

</body>
</html>
