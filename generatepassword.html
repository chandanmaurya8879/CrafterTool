<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Generator | CrafterTool</title>

<link rel="stylesheet" href="generatepassword.css">

</head>

<body>

<header class="header">

<a href="index.html" class="logo">
CrafterTool
</a>

<nav>

<a href="index.html">Home</a>

<a href="#">All Tools</a>

</nav>

</header>

<div class="container">

<h1>Password Generator</h1>

<p>
Generate a strong and secure password instantly.
</p>

<input
type="text"
id="password"
readonly
placeholder="Generated Password">

<label>Password Length</label>

<input
type="range"
id="length"
min="4"
max="32"
value="12">

<p id="lengthValue">12 Characters</p>

<div class="options">

<label>
<input type="checkbox" id="uppercase" checked>
Uppercase (A-Z)
</label>

<label>
<input type="checkbox" id="lowercase" checked>
Lowercase (a-z)
</label>

<label>
<input type="checkbox" id="numbers" checked>
Numbers (0-9)
</label>

<label>
<input type="checkbox" id="symbols" checked>
Symbols (!@#$%)
</label>

</div>

<button id="generateBtn">
Generate Password
</button>

<button id="copyBtn">
Copy Password
</button>

</div>

<script src="generatepassword.js"></script>

</body>

</html>
