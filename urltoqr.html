<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>URL to QR Code | CrafterTool</title>

<link rel="stylesheet" href="urltoqr.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<header class="header">

CrafterTool
</a>

<p>Convert any website URL into a QR code instantly.</p>
