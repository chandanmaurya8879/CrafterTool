<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Split PDF | CrafterTool</title>

<link rel="stylesheet" href="split.css">

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

</head>

<body>

<header class="header">

<a href="index.html" class="logo">CrafterTool</a>

<nav>
<a href="index.html">Home</a>
<a href="#">Tools</a>
</nav>

</header>

<div class="container">

<h1>Split PDF</h1>

<p>Extract pages from a PDF file.</p>

<input
type="file"
id="pdfInput"
accept=".pdf">

<input
type="text"
id="pageNumbers"
placeholder="Example: 1,3,5">

<button id="splitBtn">
<strong>Split PDF</strong>
</button>

  <div style="max-width: 800px;
  margin: 40px auto; 
  padding: 0 20px; 
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  text-align: left;"
    
    <!-- Main Heading -->
    <h2 style="font-size: 24px; color: #2b3a8f; margin-bottom: 20px; font-weight: 600; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">
        How to use split pdf
    </h2>
    
    <!-- Instructions List -->
    <ul style="list-style-type: none; padding-left: 0; line-height: 1.8; color: #333333; font-size: 15px;">
        <li style="margin-bottom: 15px;">
            <strong style="color: #2b3a8f;">Click the Choose file:</strong> Select any pdf from your computer or phone.
        </li>
        
        <li style="margin-bottom: 15px;">
            <strong style="color: #2b3a8f;">How much split:</strong> Enter the number the pdf is split in how much part.
        </li>
        <li style="margin-bottom: 15px;">
            <strong style="color: #2b3a8f;">split pdf:</strong> Click on split pdf to save it back to your device.
        </li>
    </ul>

</div>
  
</div>

<script src="split.js"></script>

</body>
</html>
