<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Email to QR | CrafterTool</title>

<link rel="stylesheet" href="emailtoqr.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>


<header class="header">

<a href="index.html" class="logo">
CrafterTool
</a>

<nav>
<a href="index.html">Home</a>

</nav>

<div class="container">

<h1>Email to QR Code</h1>

<p>
Convert an email address into a QR code.
</p>


<input
type="email"
id="emailInput"
placeholder="Enter email address">


<button id="generateBtn">
Generate QR Code
</button>


<div id="qrcode"></div>


<button 
id="downloadBtn"
style="display:none;">
Download QR
</button>


</div>



<script src="emailtoqr.js"></script>
