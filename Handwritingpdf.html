<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Handwriting PDF | CrafterTool</title>

<link rel="stylesheet" href="Handwritingpdf.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>

</head>


<body>


<header class="header">

<a href="index.html" class="logo">
CrafterTool
</a>

<nav>
<a href="index.html">Home</a>

</nav>

</header>



<div class="container">


<h1>Handwriting PDF</h1>

<p>
Draw your handwriting on PDF and download it.
</p>



<input 
type="file"
id="pdfFile"
accept=".pdf">



<div class="pdf-area">

<canvas id="pdfCanvas"></canvas>

<canvas id="drawCanvas"></canvas>

</div>



<div class="buttons">

<button id="clearBtn">
Clear
</button>


<button id="downloadBtn">
Download PDF
</button>

</div>


<div id="message"></div>


</div>



<script src="Handwritingpdf.js"></script>


</body>
