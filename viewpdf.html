<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>View PDF | CrafterTool</title>

<link rel="stylesheet" href="viewpdf.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

</head>

<body>

<header class="header">

<a href="index.html" class="logo">
CrafterTool
</a>

<nav>

<a href="index.html">Home</a>

<a href="#">All Tools</a>

</nav>

</header>

<div class="container">

<h1>View PDF</h1>

<p>
Upload and view PDF files directly in your browser.
</p>

<input
type="file"
id="pdfFile"
accept=".pdf">

<div class="toolbar">

<button id="prevPage">
Previous
</button>

<span id="pageInfo">
Page 0 / 0
</span>

<button id="nextPage">
Next
</button>

<button id="zoomOut">
-
</button>

<button id="zoomIn">
+
</button>

</div>

<div class="viewer">

<canvas id="pdfCanvas"></canvas>

</div>

</div>

<script src="viewpdf.js"></script>

</body>

</html>
